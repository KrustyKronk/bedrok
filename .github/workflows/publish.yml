name: publish

# A published GitHub release puts the same wheel and sdist on PyPI. Trusted
# publishing: PyPI trusts this workflow, in this repository, in the `pypi`
# environment, by OIDC, so no token is stored anywhere. The build job runs the
# clean-machine check on the exact wheel it uploads, and refuses a tag that
# disagrees with pyproject's version. A manual dispatch builds and checks
# without publishing.
#
# The bundle job builds the Claude Desktop bundle and attaches it to the
# release, only after PyPI took the wheel: a release with a bundle but no
# package would install nothing. On a dispatch it keeps the bundle as a
# workflow artifact instead. The owner's private term list does not exist
# here; the bundle is the tracked tree plus a generated uv.lock, and the
# tracked tree is checked against that list by the local test run (owner's
# decision, 2026-10-16). Here it gets the general publication gate.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag is the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $VERSION"; exit 1; }
      - name: Build sdist and wheel
        run: uv build
      - name: The seeds are inside the wheel
        run: unzip -l dist/*.whl | grep -E "bedrok/seeds/(sources|macro_catalog)\.csv"
      - name: Install into an empty home and ask two questions with no keys
        run: |
          WHEEL=$(ls dist/*.whl)
          HOME_DIR=$(mktemp -d)
          env -i HOME="$HOME_DIR" PATH="$PATH" \
            python3 scripts/mcp_smoke.py -- uvx --python 3.12 --from "$WHEEL" bedrok serve
      - name: Metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  bundle:
    needs: [build, publish]
    # publish is skipped on a dispatch; on a release it must have succeeded.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the bundle
        run: scripts/build-mcpb.sh
      - name: The bundle carries no general pattern
        run: uvx --python 3.12 pytest -q tests/test_publication.py -k bundle
      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/bedrok-*.mcpb
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bundle
          path: dist/*.mcpb
